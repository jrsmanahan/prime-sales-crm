<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Sales CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#14251C;--paper:#F5F4EF;--card:#fff;
  --green:#1E6B45;--green-dk:#155033;--green-lt:#E3EFE8;
  --steel:#4A564F;--line:#DCDCD2;--mut:#7A847E;
  --amber:#D98E1B;--amber-lt:#FBF1DD;
  --red:#B3402E;--red-lt:#F9E7E3;
  --blue:#2E5FB3;--blue-lt:#E6EDFA;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:var(--green)}
textarea{resize:vertical;min-height:70px}
label{font-size:11px;font-weight:600;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
a{color:var(--blue)}
.btn{background:var(--green);color:#fff;border:none;border-radius:7px;padding:9px 14px;font-size:13px;font-weight:600;display:inline-block;cursor:pointer}
.btn:hover{background:var(--green-dk)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--steel)}
.btn.warn{background:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.sub{color:var(--mut);font-size:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.chip.g{background:var(--green-lt);color:var(--green-dk)}
.chip.a{background:var(--amber-lt);color:#8A5A0E}
.chip.r{background:var(--red-lt);color:var(--red)}
.chip.b{background:var(--blue-lt);color:var(--blue)}
.chip.n{background:#EEEEE7;color:var(--steel)}
.notice{background:var(--amber-lt);border:1px solid #EAD2A4;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.empty{color:var(--mut);font-size:13px;padding:18px;text-align:center}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;padding:0 20px;flex-wrap:wrap}
.brand{padding:14px 0}
.brand h1{font-weight:800;font-size:16px;letter-spacing:.02em}
.brand p{font-size:10px;color:#9DB5A8;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:none;color:#9DB5A8;padding:16px 12px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--amber)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;padding:10px 0}
main{max-width:1400px;margin:0 auto;padding:22px 20px 80px}
.section-title{font-size:18px;font-weight:800;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#FAFAF6}
.overlay{position:fixed;inset:0;background:rgba(20,37,28,.55);z-index:100;display:flex;justify-content:center;align-items:flex-start;padding:30px 14px;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:820px;width:100%;padding:24px;position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:22px;color:var(--mut);cursor:pointer}
.modal-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:8px}
.modal-tabs button{background:none;border:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;cursor:pointer}
.modal-tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi.hot{border-left:4px solid var(--amber)}
.kpi .v{font-size:26px;font-weight:800;margin:2px 0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:600}
.kpi .d{font-size:12px;color:var(--mut)}
.kanban-ss{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-bottom:8px}
.kanban-sa{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding-bottom:8px}
.kcol{background:#EDEDE5;border-radius:var(--r);padding:10px;min-height:160px}
.kcol-hdr{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--steel);padding:4px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.deal-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;border-left:4px solid var(--green)}
.deal-card:hover{box-shadow:0 2px 8px rgba(20,37,28,.12)}
.deal-card.flag{border-left-color:var(--amber)}
.deal-card.overdue{border-left-color:var(--red)}
.deal-name{font-weight:700;font-size:13px}
.deal-meta{font-size:11px;color:var(--mut);margin:2px 0}
.gates{display:flex;gap:4px;margin-top:6px;align-items:center}
.gate{width:20px;height:8px;border-radius:4px;background:#E3E3D9}
.gate.ok{background:var(--green)}
.dayschip{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:#EEEEE7;color:var(--steel);float:right}
.dayschip.a{background:var(--amber-lt);color:#8A5A0E}
.dayschip.r{background:var(--red-lt);color:var(--red)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
.spin.dk{border-color:var(--line);border-top-color:var(--green)}
@keyframes sp{to{transform:rotate(360deg)}}
.timeline{border-left:2px solid var(--line);margin:8px 0 8px 6px;padding-left:14px}
.tl-item{margin-bottom:10px;position:relative}
.tl-item:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);position:absolute;left:-19px;top:5px}
.tl-date{font-size:11px;color:var(--mut)}
.filterbar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filterbar input,.filterbar select{width:auto;min-width:140px}
.role-lg{background:var(--amber-lt);color:#8A5A0E;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.role-sa{background:var(--blue-lt);color:var(--blue);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.role-sh{background:var(--green-lt);color:var(--green-dk);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.role-est{background:#F3E8FF;color:#6B21A8;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.kpi-bar{height:8px;border-radius:4px;background:#EDEDE5;overflow:hidden;margin:4px 0}
.kpi-bar-fill{height:100%;border-radius:4px;background:var(--green)}
.kpiscore{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.kpiscard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.krow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.krow:last-child{border:none}
.calday{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:90px;padding:6px;cursor:pointer}
.calday.today{border-color:var(--green)}
.appt{background:var(--green-lt);border-left:3px solid var(--green);border-radius:4px;padding:2px 6px;margin-bottom:3px;font-size:11px}
.appt.done{opacity:.6;border-left-color:var(--steel);background:#EFEFE8}
.appt.missed{border-left-color:var(--red);background:var(--red-lt)}
@media(max-width:768px){
.grid2{grid-template-columns:1fr}
.kanban-ss,.kanban-sa{grid-template-columns:1fr}
header{padding:0 12px;gap:8px}
.brand{padding:10px 0}
.brand h1{font-size:14px}
nav{width:100%;overflow-x:auto;padding-bottom:2px;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
nav button{padding:10px 10px;font-size:12px;white-space:nowrap}
.hdr-right{display:none}
main{padding:14px 12px 80px}
.section-title{font-size:16px}
.kpi-grid{grid-template-columns:1fr 1fr}
.modal{padding:16px;margin:0;border-radius:12px 12px 0 0;position:fixed;bottom:0;left:0;right:0;max-width:100%;max-height:85vh}
.overlay{padding:0;align-items:flex-end}
.modal-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
.modal-tabs button{white-space:nowrap}
.filterbar{flex-direction:column;align-items:stretch}
.filterbar input,.filterbar select{width:100%!important;min-width:unset!important}
table{font-size:12px}
th{font-size:10px;padding:6px 4px}
td{padding:7px 4px}
.kpiscore{grid-template-columns:1fr}
div[style*="grid-template-columns:220px"]{grid-template-columns:1fr!important}
.row{gap:8px}
.btn{padding:8px 12px;font-size:12px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://gwclehsjbfeinfdxkuea.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3Y2xlaHNqYmZlaW5mZHhrdWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTEwMTcsImV4cCI6MjEwMTQ4NzAxN30.Tmw_IiEkkgAlvsfj_GPPdN4Bf-aDEunFpwp55zmLzNc';
const sb=supabase.createClient(SB_URL,SB_KEY);

// ── constants ──
const SS_SUB=[
  {key:'untouched',label:'Untouched',color:'#9DB5A8',exit:'First contact made'},
  {key:'intro_sent',label:'Intro sent',color:'#D98E1B',exit:'Brand + brochure sent'},
  {key:'engaged',label:'Engaged',color:'#2E5FB3',exit:'Client responded'},
  {key:'meeting_booked',label:'Meeting booked',color:'#7B3FA0',exit:'Call scheduled'},
  {key:'profile_done',label:'Profile collected',color:'#1E6B45',exit:'Ready for handoff'},
];
const SA_STAGES=['Evaluation','Qualified','Site Inspection','Proposal','Bidding / Negotiation','Committed','Closed Sale'];
const SA_FLAGS={'Evaluation':7,'Qualified':14,'Site Inspection':21,'Proposal':30,'Bidding / Negotiation':30,'Committed':21,'Closed Sale':7};
const TOUCH=['Bidding / Negotiation','Committed'];
const SCOPES=['Full build (prefab + equipment)','Prefab building only','Equipment supply only'];
const FARM_TYPES=['Broiler','Breeder','Layer / Multi-tier','Other'];
const SOURCES=['Referral','Integrator program','Walk-in / Inbound','Agent / Broker','Self-generated'];
const DOC_TYPES=['Quotation','Official Receipt (OR)','Pro-forma Invoice','Site Inspection Report','Contract / PO','Letter of Intent','Bank Documents','Permit','Other'];
const QUOTE_STATUS=['Draft','Pending engineering review','Engineering approved','Sent to client','Revised','Final / signed'];
const TASK_TYPES=['Call','Site visit','Follow-up email','Send brochure','Send quotation','Collect PDC','Collect DP','Engineering coordination','Permit follow-up','Client meeting','Other'];
const MILESTONES=[
  ['Land',[['land_negotiation','Land identified / under negotiation'],['land_acquired','Land acquired'],['land_conversion','DAR conversion / land-use clearance'],['land_dev_started','Land development started'],['land_dev_done','Land development completed']]],
  ['Financing',[['fin_source','Financing source identified'],['loan_submitted','Bank loan application submitted'],['loan_pending','Bank loan pending'],['loan_secured','Bank loan secured / own funds confirmed']]],
  ['Market',[['integ_applied','Integrator accreditation applied'],['integ_contract','Integrator contract secured']]],
  ['Permits',[['brgy','Barangay clearance'],['mayor',"Mayor's / business permit"],['denr','DENR ECC / CNC'],['bldg_permit','Building permit'],['elec_permit','Electrical permit']]],
  ['Site readiness',[['power_applied','Power application filed'],['power_ok','Power connection approved'],['water','Water source developed'],['sitedev_proposal','Site development proposal submitted'],['civil_started','Civil works started'],['civil_done','Civil works completed']]],
  ['Commercial',[['revised_quote','Revised quotation issued'],['loi','LOI / reservation received']]],
];
const MS_LABEL={};MILESTONES.forEach(([,items])=>items.forEach(([k,l])=>MS_LABEL[k]=l));
const MS_TOTAL=MILESTONES.reduce((a,[,i])=>a+i.length,0);

// ── helpers ──
const today=()=>new Date().toISOString().slice(0,10);
const peso=n=>'₱'+Number(n||0).toLocaleString();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysSince=d=>Math.max(0,Math.floor((Date.now()-new Date(d+'T00:00:00').getTime())/86400000));
const uid=()=>Math.random().toString(36).slice(2);
function dealDays(d){
  if(TOUCH.includes(d.stage)){
    const dates=[(d.stage_history||[]).slice(-1)[0]?.date,d.updated_at?.slice(0,10)].filter(Boolean);
    return Math.max(0,daysSince(dates.sort().pop()||today()));
  }
  const h=(d.stage_history||[]).filter(x=>x.stage===d.stage);
  return daysSince(h.length?h[h.length-1].date:today());
}
const dealDayLabel=d=>TOUCH.includes(d.stage)?'idle':'in stage';
const msCount=d=>Object.values(d.milestones||{}).filter(Boolean).length;

// ── state ──
let SESSION=null,PROFILE=null,TAB='dash',PIPE_VIEW='ss';
let DEALS=[],USERS=[],TASKS=[],TRAVEL=[],APPTS=[],PLAYBOOK=[],RULEBOOK=[],QUOTE_REQS=[];
let MODAL=null,MODAL_TAB='Profile';
let CAL_MONTH=new Date(new Date().getFullYear(),new Date().getMonth(),1),CAL_FILTER='',CAL_DAY=null;
let PIPE_SEARCH='',PIPE_SP='',PIPE_STAGE='',PIPE_SCOPE='';
let KPI_PERIOD='quarter',KPI_VIEW='sa';
let AI_TOOL='coach',RP_MSGS=[],RP_SCEN='';
let API_KEY='';

// ── DB ──
const db={
  deals:()=>sb.from('crm_deals').select('*').order('created_at',{ascending:false}),
  upsertDeal:d=>sb.from('crm_deals').upsert(d).select().single(),
  users:()=>sb.from('crm_users').select('*').order('name'),
  updateUser:(id,p)=>sb.from('crm_users').update(p).eq('id',id),
  activities:id=>sb.from('crm_activities').select('*').eq('deal_id',id).order('created_at'),
  addActivity:a=>sb.from('crm_activities').insert(a),
  reports:id=>sb.from('crm_visit_reports').select('*').eq('deal_id',id).order('date'),
  addReport:r=>sb.from('crm_visit_reports').insert(r).select().single(),
  updateReport:(id,p)=>sb.from('crm_visit_reports').update(p).eq('id',id),
  docs:id=>sb.from('crm_documents').select('*').eq('deal_id',id).order('created_at'),
  addDoc:d=>sb.from('crm_documents').insert(d),
  deleteDoc:id=>sb.from('crm_documents').delete().eq('id',id),
  quoteReqs:()=>sb.from('crm_quote_requests').select('*,crm_users!requested_by(name),crm_deals(client,farm,location,sa_agent_id)').order('created_at',{ascending:false}),
  addQuoteReq:q=>sb.from('crm_quote_requests').insert(q).select().single(),
  updateQuoteReq:(id,p)=>sb.from('crm_quote_requests').update(p).eq('id',id),
  dealQuoteReqs:dealId=>sb.from('crm_quote_requests').select('*,crm_users!requested_by(name)').eq('deal_id',dealId).order('created_at',{ascending:false}),
  quotations:id=>sb.from('crm_quotations').select('*,crm_quotation_thread(*)').eq('deal_id',id).order('created_at'),
  addQuotation:q=>sb.from('crm_quotations').insert(q).select().single(),
  updateQuotation:(id,p)=>sb.from('crm_quotations').update(p).eq('id',id),
  addQThread:t=>sb.from('crm_quotation_thread').insert(t),
  tasks:()=>sb.from('crm_tasks').select('*,crm_users!assignee_id(name)').order('due',{ascending:true,nullsFirst:false}),
  upsertTask:t=>sb.from('crm_tasks').upsert(t).select().single(),
  deleteTask:id=>sb.from('crm_tasks').delete().eq('id',id),
  travel:()=>sb.from('crm_travel_requests').select('*,crm_users!requester_id(name)').order('created_at',{ascending:false}),
  addTravel:t=>sb.from('crm_travel_requests').insert(t).select().single(),
  updateTravel:(id,p)=>sb.from('crm_travel_requests').update(p).eq('id',id),
  appts:()=>sb.from('crm_appointments').select('*').order('date').order('time_slot'),
  addAppt:a=>sb.from('crm_appointments').insert(a).select().single(),
  updateAppt:(id,p)=>sb.from('crm_appointments').update(p).eq('id',id),
  deleteAppt:id=>sb.from('crm_appointments').delete().eq('id',id),
  playbook:()=>sb.from('crm_playbook').select('*').order('sort_order'),
  upsertPlaybook:p=>sb.from('crm_playbook').upsert(p).select().single(),
  deletePlaybook:id=>sb.from('crm_playbook').delete().eq('id',id),
  rulebook:()=>sb.from('crm_rulebook').select('*').order('sort_order'),
  upsertRule:r=>sb.from('crm_rulebook').upsert(r).select().single(),
  deleteRule:id=>sb.from('crm_rulebook').delete().eq('id',id),
};

// ── render engine ──
function render(){document.getElementById('app').innerHTML=buildApp()}
function el(id){return document.getElementById(id)}
function userName(id){return USERS.find(u=>u.id===id)?.name||'—'}
function ssAgent(d){return userName(d.ss_agent_id)}
function saAgent(d){return userName(d.sa_agent_id)}

async function loadAll(){
  const [{data:d},{data:u},{data:t},{data:tr},{data:a},{data:p},{data:r},{data:qr}]=await Promise.all([
    db.deals(),db.users(),db.tasks(),db.travel(),db.appts(),db.playbook(),db.rulebook(),db.quoteReqs()
  ]);
  DEALS=d||[];USERS=u||[];TASKS=t||[];TRAVEL=tr||[];APPTS=a||[];PLAYBOOK=p||[];RULEBOOK=r||[];QUOTE_REQS=qr||[];
}

// ── auth ──
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  SESSION=session;
  if(session){
    const {data}=await sb.from('crm_users').select('*').eq('id',session.user.id).single();
    PROFILE=data;
    await loadAll();
  }
  render();
  sb.auth.onAuthStateChange(async(_,session)=>{
    SESSION=session;
    if(session){
      const {data}=await sb.from('crm_users').select('*').eq('id',session.user.id).single();
      PROFILE=data;await loadAll();
    }else{PROFILE=null;DEALS=[];USERS=[];}
    render();
  });
}

// ── APP SHELL ──
function buildApp(){
  if(!SESSION)return buildLogin();
  if(!PROFILE)return'<div style="display:flex;align-items:center;justify-content:center;height:100vh"><span class="spin dk" style="width:24px;height:24px;border-width:3px"></span></div>';
  const role=PROFILE.role||'Sales Agent';
  const tabs=[
    ['dash','Dashboard'],['pipe','Pipeline'],['cal','Calendar'],
    ['tasks','Tasks'],['travel','Travel'],['play','Playbook'],['rules','Rulebook'],['ai','AI Coach'],
    ...(role==='Sales Head'?[['kpi','KPIs'],['team','Team']]:[]),
    ...(role==='Estimator'?[['quotes','Quotations']]:[]),
    ...(role==='Sales Head'?[['quotes','Quotations']]:[] )
  ];
  const navBtns=tabs.map(([k,l])=>`<button class="${TAB===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  let content='';
  if(TAB==='dash')content=buildDash();
  else if(TAB==='pipe')content=buildPipe();
  else if(TAB==='cal')content=buildCal();
  else if(TAB==='tasks')content=buildTasks();
  else if(TAB==='travel')content=buildTravel();
  else if(TAB==='play')content=buildPlay();
  else if(TAB==='rules')content=buildRules();
  else if(TAB==='ai')content=buildAI();
  else if(TAB==='kpi')content=buildKPI();
  else if(TAB==='team')content=buildTeam();
  else if(TAB==='quotes')content=buildQuotes();
  return`
    <header>
      <div class="brand"><h1>PRIME SALES</h1><p>CRM</p></div>
      <nav>${navBtns}</nav>
      <div class="hdr-right">
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:600;color:#fff">${esc(PROFILE.name)}</div>
          <div style="font-size:11px;color:#9DB5A8">${esc(role)}${PROFILE.territory?' · '+esc(PROFILE.territory):''}</div>
        </div>
        <button onclick="signOut()" style="background:none;border:1px solid #4A564F;color:#9DB5A8;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer">Sign out</button>
      </div>
    </header>
    <main>${content}</main>
    ${MODAL?buildModal():''}`;
}

async function go(t){TAB=t;await loadAll();render();}
async function signOut(){await sb.auth.signOut();SESSION=null;PROFILE=null;render();}

// ── LOGIN ──
function buildLogin(){
  return`<div style="min-height:100vh;background:#14251C;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.35)">

    f.innerHTML=`<h2 style="font-size:18px;font-weight:700;margin-bottom:20px;color:#14251C">Sign in</h2>
      <div style="margin-bottom:12px"><label style="${lStyle}">Email</label><input id="l-email" type="email" style="${iStyle}" placeholder="you@primeagritech.com"></div>
      <div style="margin-bottom:20px"><label style="${lStyle}">Password</label><input id="l-pass" type="password" style="${iStyle}" placeholder="••••••••"></div>

    links.innerHTML=`No account? <button onclick="AUTH_MODE='signup';renderAuth()" style="background:none;border:none;color:#1E6B45;font-weight:600;cursor:pointer;font-size:inherit;font-family:inherit">Sign up</button>
      &nbsp;·&nbsp; <button onclick="AUTH_MODE='reset';renderAuth()" style="background:none;border:none;color:#1E6B45;font-weight:600;cursor:pointer;font-size:inherit;font-family:inherit">Forgot password?</button>`;
  } else if(AUTH_MODE==='signup'){
    f.innerHTML=`<h2 style="font-size:18px;font-weight:700;margin-bottom:20px;color:#14251C">Create account</h2>
      <div style="margin-bottom:12px"><label style="${lStyle}">Full name</label><input id="s-name" style="${iStyle}" placeholder="e.g. Roldan Santos"></div>
      <div style="margin-bottom:12px"><label style="${lStyle}">Email</label><input id="s-email" type="email" style="${iStyle}"></div>
      <div style="margin-bottom:20px"><label style="${lStyle}">Password</label><input id="s-pass" type="password" style="${iStyle}" placeholder="min. 6 characters"></div>
      <button onclick="doSignup()" style="width:100%;padding:12px;background:#1E6B45;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Create account</button>`;
    links.innerHTML=`<button onclick="AUTH_MODE='login';renderAuth()" style="background:none;border:none;color:#1E6B45;font-weight:600;cursor:pointer;font-size:inherit;font-family:inherit">Back to sign in</button>`;
  } else {
    f.innerHTML=`<h2 style="font-size:18px;font-weight:700;margin-bottom:20px;color:#14251C">Reset password</h2>
      <div style="margin-bottom:20px"><label style="${lStyle}">Email</label><input id="r-email" type="email" style="${iStyle}"></div>
      <button onclick="doReset()" style="width:100%;padding:12px;background:#1E6B45;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Send reset email</button>`;
    links.innerHTML=`<button onclick="AUTH_MODE='login';renderAuth()" style="background:none;border:none;color:#1E6B45;font-weight:600;cursor:pointer;font-size:inherit;font-family:inherit">Back to sign in</button>`;
  }
}
function showAuthMsg(msg,isErr){
  const d=el(isErr?'auth-err':'auth-msg');if(!d)return;
  d.innerHTML=`<div style="background:${isErr?'#F9E7E3':'#E3EFE8'};border:1px solid ${isErr?'#E8C5BD':'#B0D4BC'};border-radius:8px;padding:10px 12px;font-size:13px;color:${isErr?'#B3402E':'#155033'};margin-bottom:14px">${esc(msg)}</div>`;
}
async function doLogin(){
  const e=el('l-email')?.value,p=el('l-pass')?.value;
  const {error}=await sb.auth.signInWithPassword({email:e,password:p});
  if(error)showAuthMsg(error.message,true);
}
async function doSignup(){
  const n=el('s-name')?.value?.trim(),e=el('s-email')?.value,p=el('s-pass')?.value;
  if(!n){showAuthMsg('Full name is required.',true);return;}
  const {error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:n}}});
  if(error)showAuthMsg(error.message,true);
  else showAuthMsg('Account created! Check your email to confirm, then sign in. Your Sales Head will set your role.',false);
}
async function doReset(){
  const e=el('r-email')?.value;
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:window.location.origin});
  if(error)showAuthMsg(error.message,true);
  else showAuthMsg('Password reset email sent. Check your inbox.',false);
}

// ── DASHBOARD ──
function buildDash(){
  const role=PROFILE.role;const isAdmin=role==='Sales Head';const isSS=role==='Lead Gen';
  const open=DEALS.filter(d=>d.status==='open');
  const qd=new Date();qd.setDate(1);qd.setMonth(Math.floor(qd.getMonth()/3)*3);
  const won=DEALS.filter(d=>d.status==='won'&&(d.won_date||'')>=qd.toISOString().slice(0,10));
  const wonVal=won.reduce((a,d)=>a+(+d.value||0),0);
  const myOpen=isSS?open.filter(d=>d.ss_agent_id===PROFILE.id):open.filter(d=>d.sa_agent_id===PROFILE.id);
  const flagged=(isAdmin?open:myOpen).filter(d=>dealDays(d)>(SA_FLAGS[d.stage]||14));
  const noNext=myOpen.filter(d=>!d.next_action);
  const funnel=SA_STAGES.map(st=>{
    const ds=(isAdmin?open:myOpen).filter(d=>d.stage===st);
    return`<div style="background:var(--green-lt);border-radius:8px;padding:10px 12px;text-align:center">
      <div style="font-size:24px;font-weight:800">${ds.length}</div>
      <div style="font-size:11px;font-weight:600;color:var(--steel);margin-top:2px">${st}</div>
      <div class="sub">${peso(ds.reduce((a,d)=>a+(+d.value||0),0))}</div></div>`;
  }).join('');
  const flagRows=flagged.slice(0,8).map(d=>`<tr>
    <td><b>${esc(d.client)}</b><div class="sub">${esc(d.farm)}</div></td>
    <td>${esc(d.stage)}</td>
    <td><span class="chip r">${dealDays(d)}d ${dealDayLabel(d)}</span></td>
    <td class="sub">${esc(saAgent(d))}</td>
    <td class="sub">${esc(d.next_action||'— none set')}</td></tr>`).join('');
  return`<div class="section-title">Dashboard</div>
  <div class="kpi-grid">
    ${role==='Estimator'?`<div class="kpi ${QUOTE_REQS.filter(q=>q.status==='pending').length?'hot':''}"><div class="l">Pending quotations</div><div class="v">${QUOTE_REQS.filter(q=>q.status==='pending').length}</div><div class="d">${QUOTE_REQS.filter(q=>q.status==='in_progress').length} in progress</div></div>`:''}
    ${!isSS&&role!=='Estimator'?`<div class="kpi"><div class="l">Pipeline value</div><div class="v">${peso(myOpen.reduce((a,d)=>a+(+d.value||0),0))}</div><div class="d">${myOpen.length} open deals</div></div>`:''}
    ${isAdmin?`<div class="kpi"><div class="l">Closed this quarter</div><div class="v">${peso(wonVal)}</div><div class="d">${won.length} deals won</div></div>`:''}
    <div class="kpi ${flagged.length?'hot':''}"><div class="l">Past stage flag</div><div class="v">${flagged.length}</div><div class="d">need attention</div></div>
    <div class="kpi ${noNext.length?'hot':''}"><div class="l">No next action</div><div class="v">${noNext.length}</div><div class="d">dormant risk</div></div>
    ${isSS?`<div class="kpi"><div class="l">My leads</div><div class="v">${myOpen.filter(d=>d.stage==='Lead').length}</div><div class="d">${myOpen.filter(d=>d.substage==='profile_done').length} ready for handoff</div></div>`:''}
  </div>
  ${!isSS?`<div class="card" style="margin-bottom:14px"><h3 style="font-size:14px;margin-bottom:10px">Sales funnel</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px">${funnel}</div></div>`:''}
  <div class="card"><h3 style="font-size:14px;margin-bottom:${flagged.length?10:0}px">⚠ Flagged deals</h3>
    ${flagged.length?`<table><thead><tr><th>Client</th><th>Stage</th><th>Days</th><th>Agent</th><th>Next action</th></tr></thead><tbody>${flagRows}</tbody></table>`:'<div class="empty">No flagged deals. Clean pipeline!</div>'}
  </div>`;
}

// ── PIPELINE ──
function buildPipe(){
  const role=PROFILE.role;
  const allOpen=DEALS.filter(d=>d.status==='open');
  const allClosed=DEALS.filter(d=>d.status!=='open');
  function filt(ds){
    return ds.filter(d=>{
      if(PIPE_SEARCH){const q=PIPE_SEARCH.toLowerCase();if(![d.client,d.farm,d.location].some(f=>f?.toLowerCase().includes(q)))return false;}
      if(PIPE_SP){if(PIPE_VIEW==='ss'&&d.ss_agent_id!==PIPE_SP)return false;if(PIPE_VIEW==='sa'&&d.sa_agent_id!==PIPE_SP)return false;}
      if(PIPE_SCOPE&&d.scope!==PIPE_SCOPE)return false;
      if(PIPE_STAGE){if(PIPE_VIEW==='ss'&&(d.substage||'untouched')!==PIPE_STAGE)return false;if(PIPE_VIEW==='sa'&&d.stage!==PIPE_STAGE)return false;}
      return true;
    });
  }
  const agentOpts='<option value="">All agents</option>'+USERS.map(u=>`<option value="${u.id}" ${PIPE_SP===u.id?'selected':''}>${esc(u.name)}</option>`).join('');
  const clearBtn=(PIPE_SEARCH||PIPE_SP||PIPE_SCOPE||PIPE_STAGE)?`<button class="btn sec sm" onclick="PIPE_SEARCH='';PIPE_SP='';PIPE_SCOPE='';PIPE_STAGE='';render()">Clear</button>`:'';
  const toggle=`<div style="background:#EDEDE5;border-radius:8px;padding:3px;display:flex;gap:2px">
    ${role!=='Sales Agent'?`<button class="btn sm ${PIPE_VIEW==='ss'?'':'sec'}" style="${PIPE_VIEW==='ss'?'':'background:transparent;border:none'}" onclick="PIPE_VIEW='ss';PIPE_STAGE='';render()">Lead Gen</button>`:''}
    ${role!=='Lead Gen'?`<button class="btn sm ${PIPE_VIEW==='sa'?'':'sec'}" style="${PIPE_VIEW==='sa'?'':'background:transparent;border:none'}" onclick="PIPE_VIEW='sa';PIPE_STAGE='';render()">Sales Agents</button>`:''}
  </div>`;
  const hdr=`<div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="section-title" style="margin:0">Pipeline</div>
    <div class="row">${toggle}<button class="btn" onclick="openDeal(null)">+ New lead</button></div></div>`;

  if(PIPE_VIEW==='ss'){
    const leads=filt(allOpen.filter(d=>d.stage==='Lead'));
    const ssStgOpts='<option value="">All substages</option>'+SS_SUB.map(s=>`<option value="${s.key}" ${PIPE_STAGE===s.key?'selected':''}>${s.label}</option>`).join('');
    const readyN=leads.filter(d=>(d.substage||'untouched')==='profile_done').length;
    const cols=SS_SUB.map(ss=>{
      const ds=leads.filter(d=>(d.substage||'untouched')===ss.key);
      const cards=ds.map(d=>`<div class="deal-card" style="border-left-color:${ss.color}" onclick="openDeal('${d.id}')">
        <div class="deal-name">${esc(d.client)}</div>
        <div class="deal-meta">${esc(d.location)} · ${esc(ssAgent(d))}</div>
        <div class="deal-meta">${esc(d.contact||'')}${d.email?' · '+esc(d.email):''}</div>
        ${d.next_action?`<div class="deal-meta" style="margin-top:4px">→ ${esc(d.next_action)} <span class="sub">${esc(d.next_action_date||'')}</span></div>`:'<div class="deal-meta" style="color:var(--red)">→ no next action</div>'}
      </div>`).join('');
      return`<div class="kcol"><div class="kcol-hdr" style="border-bottom:3px solid ${ss.color};flex-direction:column;align-items:flex-start;gap:2px;padding-bottom:8px">
        <span>${ss.label} (${ds.length})</span><span style="font-size:10px;color:var(--mut);font-weight:400">→ ${ss.exit}</span></div>
        ${cards||'<div class="empty">empty</div>'}</div>`;
    }).join('');
    return hdr+`<div class="filterbar">
      <input placeholder="Search…" value="${esc(PIPE_SEARCH)}" oninput="PIPE_SEARCH=this.value;render()" style="min-width:180px;width:auto">
      <select onchange="PIPE_SP=this.value;render()" style="width:auto">${agentOpts}</select>
      <select onchange="PIPE_STAGE=this.value;render()" style="width:auto">${ssStgOpts}</select>
      ${clearBtn}${readyN?`<span class="chip a" style="margin-left:auto">⚠ ${readyN} ready for handoff</span>`:''}
    </div>
    <div class="sub" style="margin-bottom:8px">Lead Gen goal: intro → meeting → profile → handoff to Sales Agent.</div>
    <div class="kanban-ss">${cols}</div>`;
  }

  const saDeals=filt(allOpen.filter(d=>SA_STAGES.includes(d.stage)));
  const stgOpts='<option value="">All stages</option>'+SA_STAGES.map(s=>`<option ${PIPE_STAGE===s?'selected':''}>${s}</option>`).join('');
  const SA_DEFS={
    'Evaluation':'Land acquired? Financing path clear? Market identified? Timeline realistic?',
    'Qualified':'Gates confirmed — conduct site visit and build quotation',
    'Site Inspection':'Visit site — measure, assess access, document. Build quotation for bank submission.',
    'Proposal':'Present quotation — client submits to bank or confirms own funds',
    'Bidding / Negotiation':'Active back-and-forth on scope, price, or terms',
    'Committed':'Verbal yes — waiting on bank approval or final confirmation. Collect signatures and PDCs.',
    'Closed Sale':'Signed pro-forma, cleared DP, PDCs collected',
  };
  const cols=SA_STAGES.map(st=>{
    const ds=saDeals.filter(d=>d.stage===st).sort((a,b)=>dealDays(b)-dealDays(a));
    const cards=ds.map(d=>{
      const days=dealDays(d),flag=SA_FLAGS[st]||14,g=d.gates||{};
      const cls=days>flag?'overdue':days>flag*.7?'flag':'';
      const dc=days>flag?'r':days>flag*.7?'a':'';
      return`<div class="deal-card ${cls}" onclick="openDeal('${d.id}')">
        <span class="dayschip ${dc}">${days}d ${dealDayLabel(d)}</span>
        <div class="deal-name">${esc(d.client)}</div>
        <div class="deal-meta">${esc(d.farm)} · ${esc(d.location)}</div>
        <div class="deal-meta">${peso(d.value)} · ${d.num_bldgs||1}x ${esc(d.house_model||d.farm_type||'')} · ${esc(saAgent(d))}</div>
        <div class="gates">
          <span class="gate ${g.land?'ok':''}" title="Land"></span><span class="gate ${g.money?'ok':''}" title="Money"></span>
          <span class="gate ${g.market?'ok':''}" title="Market"></span><span class="gate ${g.timeline?'ok':''}" title="Timeline"></span>
          <span class="sub" style="margin-left:auto;font-size:10px">◉ ${msCount(d)}/${MS_TOTAL}</span>
        </div>
        ${d.next_action?`<div class="deal-meta" style="margin-top:5px">→ ${esc(d.next_action)} <span class="sub">${esc(d.next_action_date||'')}</span></div>`:'<div class="deal-meta" style="margin-top:5px;color:var(--red)">→ no next action</div>'}
      </div>`;
    }).join('');
    return`<div class="kcol"><div class="kcol-hdr" style="flex-direction:column;align-items:flex-start;gap:2px;padding-bottom:8px;border-bottom:3px solid var(--green)">
      <div style="display:flex;justify-content:space-between;width:100%;align-items:center">
        <span>${st} (${ds.length})</span>
        <span style="font-size:10px;color:var(--mut);font-weight:400">${TOUCH.includes(st)?`flag ${SA_FLAGS[st]}d idle`:`flag ${SA_FLAGS[st]}d`}</span>
      </div>
      <span style="font-size:10px;color:var(--mut);font-weight:400">→ ${SA_DEFS[st]||''}</span>
    </div>${cards||'<div class="empty">empty</div>'}</div>`;
  }).join('');
  const closedRows=filt(allClosed).map(d=>`<tr onclick="openDeal('${d.id}')" style="cursor:pointer">
    <td><b>${esc(d.client)}</b></td>
    <td>${d.status==='won'?'<span class="chip g">WON</span>':'<span class="chip r">LOST</span>'}</td>
    <td>${peso(d.value)}</td><td>${esc(saAgent(d))}</td>
    <td class="sub">${esc(d.status==='won'?'Won '+(d.won_date||''):d.lost_reason)}</td></tr>`).join('');
  return hdr+`<div class="filterbar">
    <input placeholder="Search…" value="${esc(PIPE_SEARCH)}" oninput="PIPE_SEARCH=this.value;render()" style="min-width:180px;width:auto">
    <select onchange="PIPE_SP=this.value;render()" style="width:auto">${agentOpts}</select>
    <select onchange="PIPE_STAGE=this.value;render()" style="width:auto">${stgOpts}</select>
    <select onchange="PIPE_SCOPE=this.value;render()" style="width:auto"><option value="">All scopes</option>${SCOPES.map(s=>`<option ${PIPE_SCOPE===s?'selected':''}>${s}</option>`).join('')}</select>
    ${clearBtn}<span class="sub" style="margin-left:auto">${saDeals.length} shown</span>
  </div>
  <div class="sub" style="margin-bottom:10px">KPI clock starts from handoff date. Bidding/Committed flag on idle days.</div>
  <div class="kanban-sa">${cols}</div>
  ${closedRows?`<div class="card" style="margin-top:16px"><h3 style="font-size:14px;margin-bottom:10px">Closed deals</h3><table><thead><tr><th>Client</th><th>Result</th><th>Value</th><th>Agent</th><th>Note</th></tr></thead><tbody>${closedRows}</tbody></table></div>`:''}`;
}

// ── DEAL MODAL ──
let DEAL_DATA={activities:[],reports:[],docs:[],quoteReqs:[]};

async function openDeal(id){
  const d=id?DEALS.find(x=>x.id===id):null;
  MODAL={type:'deal',deal:d};MODAL_TAB='Profile';
  if(d){
    const [{data:a},{data:r},{data:dc},{data:qr}]=await Promise.all([
      db.activities(d.id),db.reports(d.id),db.docs(d.id),db.dealQuoteReqs(d.id)

    DEAL_DATA={activities:a||[],reports:r||[],docs:dc||[],quoteReqs:qr||[]};
  }else{
    DEAL_DATA={activities:[],reports:[],docs:[],quoteReqs:[]};
  }
  render();
}

// ── AUTO TASK CREATION ──
// Rules:
//   1. If next action + date are set on a deal → create a task for that action on that date
//   2. Every SA-stage open deal → ensure a "Follow-up call" task exists within the next 14 days
//      (skip if one already exists for this deal due within 14 days)
const FOLLOWUP_STAGES=['Evaluation','Qualified','Site Inspection','Proposal','Bidding / Negotiation','Committed'];

async function autoCreateTasks(dealId, deal, assigneeId, nextAction, nextActionDate){
  const promises=[];

  // Rule 1: next action task
  if(nextAction?.trim() && nextActionDate){
    // Check if a task for this deal with same title and date already exists
    const exists=TASKS.some(t=>t.deal_id===dealId&&t.title===nextAction&&t.due===nextActionDate&&t.status==='open');
    if(!exists){
      promises.push(db.upsertTask({
        title: nextAction,
        type: nextAction.toLowerCase().includes('visit')||nextAction.toLowerCase().includes('inspect')?'Site visit'
              :nextAction.toLowerCase().includes('quote')||nextAction.toLowerCase().includes('proposal')?'Send quotation'
              :'Call',
        due: nextActionDate,
        assignee_id: assigneeId||null,
        deal_id: dealId,
        notes: `Auto-created from deal: ${deal?.client||''}`,
        created_by: PROFILE.id,
        status: 'open'
      }));
    }
  }

  // Rule 2: 2-week follow-up call for SA stages
  if(FOLLOWUP_STAGES.includes(deal?.stage||'')){
    const twoWeeksOut=new Date();twoWeeksOut.setDate(twoWeeksOut.getDate()+14);
    const twoWeeksStr=twoWeeksOut.toISOString().slice(0,10);
    // Check if an open follow-up call task for this deal exists within next 14 days
    const hasFollowup=TASKS.some(t=>
      t.deal_id===dealId &&
      t.status==='open' &&
      (t.type==='Call'||t.title?.toLowerCase().includes('follow-up call')) &&
      t.due && t.due<=twoWeeksStr
    );
    if(!hasFollowup){
      // Schedule 2 weeks from today
      promises.push(db.upsertTask({
        title: `Follow-up call — ${deal?.client||''}`,
        type: 'Call',
        due: twoWeeksStr,
        assignee_id: assigneeId||null,
        deal_id: dealId,
        notes: 'Auto-scheduled: 2-week follow-up call for pipeline update',
        created_by: PROFILE.id,
        status: 'open'
      }));
    }
  }

  await Promise.all(promises);
}

async function saveDeal(id){
  const v=k=>el(k)?.value;
  if(!v('f_client')?.trim()){alert('Client name is required.');return;}
  const deal=id?DEALS.find(d=>d.id===id):null;
  const stage=v('f_stg');
  const sh=[...(deal?.stage_history||[])];
  if(deal&&deal.stage!==stage)sh.push({stage,date:today()});
  const gates={land:el('g_land')?.checked||false,money:el('g_money')?.checked||false,market:el('g_market')?.checked||false,timeline:el('g_timeline')?.checked||false};
  const assigneeId=v('f_sp')||deal?.sa_agent_id||null;
  const nextAction=v('f_na');
  const nextActionDate=v('f_nad')||null;
  const payload={
    ...(id?{id}:{}),
    client:v('f_client'),farm:v('f_farm'),location:v('f_loc'),value:+v('f_val')||0,
    ss_agent_id:v('f_ssag')||null,sa_agent_id:assigneeId,
    source:v('f_src'),scope:v('f_scope'),farm_type:v('f_ft'),house_model:v('f_hm'),num_bldgs:+v('f_nb')||1,
    stage,substage:v('f_ss')||'untouched',gates,
    next_action:nextAction,next_action_date:nextActionDate,
    target_date:v('f_td')||null,travel_budget:+v('f_tb')||0,
    contact:v('f_contact'),email:v('f_email'),office_address:v('f_offaddr')||'',reqs:v('f_reqs'),
    stage_history:sh,milestones:deal?.milestones||{},
    updated_at:new Date().toISOString()
  };
  const {data:saved}=await db.upsertDeal(payload);
  const dealId=saved?.id||id;
  const mergedDeal={...payload,stage};
  if(dealId)await autoCreateTasks(dealId,mergedDeal,assigneeId,nextAction,nextActionDate);
  await loadAll();closeModal();
}

async function handleFileInput(event,dealId){

async function uploadFiles(files,dealId){
  const prog=el('upload-progress-'+dealId);
  for(const file of files){
    if(prog)prog.innerHTML=`<div class="notice" style="margin-bottom:8px">⬆ Uploading ${esc(file.name)}…</div>`;
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=`${dealId}/${Date.now()}_${safeName}`;
    const {error}=await sb.storage.from('deal-docs').upload(path,file,{upsert:false});
    if(error){
      if(prog)prog.innerHTML=`<div class="notice" style="background:var(--red-lt);margin-bottom:8px">Error uploading ${esc(file.name)}: ${esc(error.message)}</div>`;
      await new Promise(r=>setTimeout(r,3000));
      if(prog)prog.innerHTML='';
      continue;
    }
    const ext=file.name.split('.').pop().toLowerCase();
    const type=ext==='pdf'?'Quotation':['jpg','jpeg','png'].includes(ext)?'Site Inspection Report':'Other';
    await db.addDoc({deal_id:dealId,type,name:file.name,link:'',filed_by:PROFILE.name,storage_path:path});
    if(prog)prog.innerHTML='';
  }
  const {data}=await db.docs(dealId);DEAL_DATA.docs=data||[];render();
}
async function downloadDoc(path,name){
  const {data,error}=await sb.storage.from('deal-docs').createSignedUrl(path,120);
  if(error){alert('Could not generate download link: '+error.message);return;}
  const a=document.createElement('a');a.href=data.signedUrl;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
}
async function delDoc(docId,dealId){
  const doc=DEAL_DATA.docs.find(d=>d.id===docId);
  if(doc?.storage_path)await sb.storage.from('deal-docs').remove([doc.storage_path]);
  await db.deleteDoc(docId);
  const {data}=await db.docs(dealId);DEAL_DATA.docs=data||[];render();
}

// ── CALENDAR ──
function buildCal(){
  const yr=CAL_MONTH.getFullYear(),mo=CAL_MONTH.getMonth();
  const monthLabel=CAL_MONTH.toLocaleDateString('en-PH',{month:'long',year:'numeric'});
  const names=[...new Set(APPTS.map(a=>a.sp_name))].filter(Boolean);
  const fOpts='<option value="">Everyone</option>'+names.map(n=>`<option ${CAL_FILTER===n?'selected':''}>${esc(n)}</option>`).join('');
  const firstDay=new Date(yr,mo,1),lastDay=new Date(yr,mo+1,0);
  const startPad=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startPad+lastDay.getDate())/7)*7;
  const td=today();
  const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const hdrs=DOW.map(d=>`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);text-align:center;padding:6px 0">${d}</div>`).join('');
  const cells=[...Array(totalCells)].map((_,i)=>{
    const dn=i-startPad+1;
    if(dn<1||dn>lastDay.getDate())return'<div style="background:#F5F4EF;border:1px solid #E8E8E0;border-radius:8px;min-height:90px"></div>';
    const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(dn).padStart(2,'0');
    const da=APPTS.filter(a=>a.date===ds&&(!CAL_FILTER||a.sp_name===CAL_FILTER)).sort((a,b)=>(a.time_slot||'').localeCompare(b.time_slot||''));
    const isToday=ds===td;
    const items=da.slice(0,3).map(a=>`<div class="appt ${a.status}" onclick="event.stopPropagation();viewAppt('${a.id}')" style="cursor:pointer">
      ${a.status==='done'?'✓ ':a.status==='missed'?'✗ ':''}<b>${esc(a.sp_name.split(' ').slice(-1)[0])}</b> ${esc(a.time_slot||'')} ${esc(a.client||a.purpose||'')}</div>`).join('');
    const more=da.length>3?`<div class="sub" style="font-size:10px;padding:2px 4px">+${da.length-3} more</div>`:'';
    return`<div class="calday ${isToday?'today':''}" onclick="CAL_DAY='${ds}';render()" style="min-height:90px;padding:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;font-weight:${isToday?800:600};${isToday?'background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center':'color:var(--steel)'}">${dn}</span>
        ${da.length?`<span class="sub" style="font-size:10px">${da.length}</span>`:''}
      </div>${items}${more}</div>`;
  }).join('');
  const monthAppts=APPTS.filter(a=>{const d=new Date(a.date+'T00:00:00');return d.getFullYear()===yr&&d.getMonth()===mo&&(!CAL_FILTER||a.sp_name===CAL_FILTER)});
  const dayPanel=CAL_DAY?buildDayPanel():'' ;
  return`<div class="row" style="justify-content:space-between;margin-bottom:8px">
    <div class="section-title" style="margin:0">Calendar</div>
    <button class="btn" onclick="MODAL={type:'appt',date:today()};render()">+ Submit appointment</button></div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn sec sm" onclick="CAL_MONTH=new Date(${yr},${mo-1},1);CAL_DAY=null;render()">◀ Prev</button>
    <button class="btn sec sm" onclick="CAL_MONTH=new Date(new Date().getFullYear(),new Date().getMonth(),1);CAL_DAY=null;render()">This month</button>
    <button class="btn sec sm" onclick="CAL_MONTH=new Date(${yr},${mo+1},1);CAL_DAY=null;render()">Next ▶</button>
    <b style="font-size:16px;font-weight:800">${monthLabel}</b>
    <select onchange="CAL_FILTER=this.value;render()" style="width:auto;margin-left:auto">${fOpts}</select>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">${hdrs}</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
  ${monthAppts.length?`<div class="sub" style="margin-top:10px">${monthLabel}: ${monthAppts.length} appointments · ${monthAppts.filter(a=>a.status==='done').length} done · ${monthAppts.filter(a=>a.status==='missed').length} missed</div>`:''}
  ${dayPanel}
  ${MODAL?.type==='appt'?buildApptModal():''}`;
}
function buildDayPanel(){
  const da=APPTS.filter(a=>a.date===CAL_DAY&&(!CAL_FILTER||a.sp_name===CAL_FILTER)).sort((a,b)=>(a.time_slot||'').localeCompare(b.time_slot||''));
  const d=new Date(CAL_DAY+'T00:00:00');
  const label=d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric'});
  return`<div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h3 style="font-size:14px">${label}</h3>

    </div>
    ${da.map(a=>`<div style="background:${a.status==='done'?'#EFEFE8':a.status==='missed'?'var(--red-lt)':'var(--green-lt)'};border:1px solid ${a.status==='done'?'var(--line)':a.status==='missed'?'var(--red)':'var(--green)'};border-radius:8px;padding:10px;margin-bottom:8px">
      <div style="font-weight:700">${a.status==='done'?'✓ ':a.status==='missed'?'✗ ':''}${esc(a.sp_name)}</div>
      <div class="sub">${esc(a.time_slot||'')} · ${esc(a.purpose)}${a.client?' — '+esc(a.client):''}</div>
      ${a.location?`<div class="sub">${esc(a.location)}</div>`:''}

        ${a.status!=='done'?`<button class="btn sm" onclick="setApptStatus('${a.id}','done')">✓ Done</button>`:''}
        ${a.status!=='missed'?`<button class="btn sm sec" onclick="setApptStatus('${a.id}','missed')">✗ Missed</button>`:''}
        ${(PROFILE.id===a.user_id||PROFILE.role==='Sales Head')?`<button class="btn sm warn" onclick="delAppt('${a.id}')">Delete</button>`:''}

    return`<div class="card" style="margin-bottom:8px;padding:10px;opacity:${t.status==='done'?.6:1}">

      ${todayT.map(mkCard).join('')}${todayT.length===0?'<div class="empty">Nothing due today</div>':''}
    </div>
    <div style="background:#EDEDE5;border-radius:var(--r);padding:10px">
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);font-weight:700;margin-bottom:10px">Upcoming (${upcoming.length})</div>
      ${upcoming.map(mkCard).join('')}${upcoming.length===0?'<div class="empty">All clear</div>':''}
    </div>
  </div>
  ${done.length?`<div class="card" style="margin-top:14px"><h3 style="font-size:14px;margin-bottom:10px">Done (last 20)</h3>${done.map(mkCard).join('')}</div>`:''}

  await db.upsertTask({...(id&&id!=='null'?{id}:{}),title:v('t_title'),type:v('t_type'),due:v('t_due')||null,assignee_id:v('t_sp')||null,deal_id:v('t_deal')||null,notes:v('t_notes'),created_by:PROFILE.id,status:'open'});

async function seedFollowups(){
  const openSADeals=DEALS.filter(d=>d.status==='open'&&FOLLOWUP_STAGES.includes(d.stage));
  if(!openSADeals.length){alert('No open SA-stage deals found.');return;}
  let created=0;
  for(const d of openSADeals){
    const assigneeId=d.sa_agent_id||null;
    const twoWeeksOut=new Date();twoWeeksOut.setDate(twoWeeksOut.getDate()+14);
    const twoWeeksStr=twoWeeksOut.toISOString().slice(0,10);
    const hasFollowup=TASKS.some(t=>
      t.deal_id===d.id&&t.status==='open'&&
      (t.type==='Call'||t.title?.toLowerCase().includes('follow-up call'))&&
      t.due&&t.due<=twoWeeksStr
    );
    if(!hasFollowup){
      await db.upsertTask({
        title:`Follow-up call — ${d.client}`,
        type:'Call',
        due:twoWeeksStr,
        assignee_id:assigneeId,
        deal_id:d.id,
        notes:'Auto-scheduled: 2-week follow-up call for pipeline update',
        created_by:PROFILE.id,
        status:'open'
      });
      created++;
    }
  }
  await loadAll();render();
  alert(`Done — created ${created} follow-up call task${created!==1?'s':''} for ${openSADeals.length} open deals.`);
}

// ── KPIs ──
function buildKPI(){
  const now=new Date();
  const qStart=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1);
  const mStart=new Date(now.getFullYear(),now.getMonth(),1);
  const cutoff=(KPI_PERIOD==='month'?mStart:qStart).toISOString().slice(0,10);
  const label=KPI_PERIOD==='month'?now.toLocaleDateString('en-PH',{month:'long',year:'numeric'}):'Q'+(Math.floor(now.getMonth()/3)+1)+' '+now.getFullYear();
  const Bar=(pct,warn=75)=>`<div class="kpi-bar" style="margin:4px 0 6px"><div class="kpi-bar-fill${pct<warn?' warn':''}" style="width:${Math.min(pct,100)}%"></div></div>`;
  const Score=(val,label,sub,pct,warn)=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px"><span style="color:var(--steel)">${label}</span><b>${val}</b></div>
    ${sub?`<div class="sub" style="font-size:11px;margin-top:1px">${sub}</div>`:''}
    ${pct!==undefined?Bar(pct,warn):''}
  </div>`;
  const Section=(title,color,rows)=>`<div style="margin-bottom:12px">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${color};margin-bottom:6px;padding-bottom:4px;border-bottom:2px solid ${color}">${title}</div>
    ${rows}
  </div>`;

  // ── SA KPIs ──
  function saKpi(u){
    const openDeals=DEALS.filter(d=>d.sa_agent_id===u.id&&d.status==='open'&&SA_STAGES.includes(d.stage));

    // KPI 1: Follow-up calls completed on schedule
    // Done = call tasks linked to their deals marked done in period
    // Missed = call tasks linked to their deals overdue / missed in period
    const callTasks=TASKS.filter(t=>t.assignee_id===u.id&&t.type==='Call'&&t.deal_id&&(t.due||'')>=cutoff);
    const callsDone=callTasks.filter(t=>t.status==='done').length;
    const callsMissed=callTasks.filter(t=>t.status==='open'&&t.due&&t.due<today()).length;
    const callsTotal=callsDone+callsMissed;
    const callRate=callsTotal?Math.round(callsDone/callsTotal*100):null;

    // KPI 2: Visit reports within 24hrs
    // We track: reports filed per deal vs visits in period
    // Approximation: visit reports filed in period for their deals
    // "On time" = report filed same day or next day as the appointment
    const theirAppts=APPTS.filter(a=>a.user_id===u.id&&(a.date||'')>=cutoff&&a.status==='done');
    // We compare appointment count vs reports filed in same window
    // Reports filed in period
    const rptDeals=openDeals.concat(DEALS.filter(d=>d.sa_agent_id===u.id&&d.status!=='open'));
    // Simple: count reports in period vs done appointments in period
    const visitsCount=theirAppts.length;
    // We can't directly link appts to reports without extra data, so show both counts
    // and let the SH judge compliance

    // KPI 3: Next action coverage
    // % of open deals that have a next action set
    const withNA=openDeals.filter(d=>d.next_action?.trim()).length;
    const naRate=openDeals.length?Math.round(withNA/openDeals.length*100):null;

    // KPI 4: Travel spend per stage move
    // Travel spend = sum of visit report costs in period for their deals
    // Stage moves = count of stage_history entries in period across their deals
    const dealIds=new Set([...openDeals,...DEALS.filter(d=>d.sa_agent_id===u.id)].map(d=>d.id));
    // We'll compute from deals stage_history
    const stageMoves=DEALS.filter(d=>d.sa_agent_id===u.id)
      .reduce((a,d)=>a+(d.stage_history||[]).filter(h=>h.date>=cutoff).length,0);
    // Travel spend: sum of est_cost from approved travel requests
    const travelSpend=TRAVEL.filter(t=>t.requester_id===u.id&&t.status==='approved'&&(t.date||'')>=cutoff)
      .reduce((a,t)=>a+(+t.est_cost||0),0);
    const spendPerMove=stageMoves?Math.round(travelSpend/stageMoves):null;

    // Goals (separate)
    const won=DEALS.filter(d=>d.sa_agent_id===u.id&&d.status==='won'&&(d.won_date||'')>=cutoff);
    const wonVal=won.reduce((a,d)=>a+(+d.value||0),0);
    const target=+u.quarter_target||0;
    const att=target?Math.round(wonVal/target*100):null;
    const pipeVal=openDeals.reduce((a,d)=>a+(+d.value||0),0);
    const pipeRatio=target?+(pipeVal/target).toFixed(1):null;

    return{openDeals:openDeals.length,callsDone,callsMissed,callsTotal,callRate,visitsCount,naRate,withNA,noNA:openDeals.length-withNA,travelSpend,stageMoves,spendPerMove,won:won.length,wonVal,target,att,pipeVal,pipeRatio};
  }

  // ── SS KPIs ──
  function ssKpi(u){
    const mine=DEALS.filter(d=>d.ss_agent_id===u.id);

    // Leads introduced = substage moved past untouched in period
    const introduced=mine.filter(d=>{
      const first=(d.stage_history||[])[0]?.date||d.created_at?.slice(0,10)||'';
      return first>=cutoff&&(d.substage||'untouched')!=='untouched';
    }).length;

    // Calls / touchpoints = call tasks done by this user in period (SS agents use tasks too)
    const callsDone=TASKS.filter(t=>t.assignee_id===u.id&&t.type==='Call'&&t.status==='done'&&(t.due||'')>=cutoff).length;

    // Meetings booked = deals that reached meeting_booked or profile_done substage in period
    const meetings=mine.filter(d=>['meeting_booked','profile_done'].includes(d.substage||'')&&
      (d.stage_history||[])[0]?.date>=cutoff).length;

    // Profiles collected and handed off
    const handoffs=mine.filter(d=>d.handoff?.date>=cutoff).length;
    const assigned=mine.filter(d=>{
      const first=(d.stage_history||[])[0]?.date||d.created_at?.slice(0,10)||'';
      return first>=cutoff;
    }).length;
    const handoffRate=assigned?Math.round(handoffs/assigned*100):null;

    return{introduced,callsDone,meetings,handoffs,assigned,handoffRate};
  }

  const ssAgents=USERS.filter(u=>u.role==='Lead Gen');
  const saAgents=USERS.filter(u=>u.role==='Sales Agent');

  const saCards=saAgents.map(u=>{
    const v=saKpi(u);
    return`<div class="kpiscard">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <div>
          <div style="font-weight:700;font-size:14px">${esc(u.name)}</div>
          <div><span class="role-sa">Sales Agent</span>${u.territory?` <span class="sub">— ${esc(u.territory)}</span>`:''}</div>
        </div>
      </div>

      ${Section('Behavior KPIs — what the agent controls','var(--blue)',`
        ${Score(
          v.callRate!==null?`${v.callsDone} done · ${v.callsMissed} missed (${v.callRate}%)`:'No call tasks yet',
          'Follow-up calls on schedule',
          'Call tasks completed vs overdue for their deals',
          v.callRate,70
        )}
        ${Score(
          v.visitsCount?`${v.visitsCount} visits done`:'No visits logged',
          'Visits completed this period',
          'Appointments marked done — compare vs visit reports filed'
        )}
        ${Score(
          v.naRate!==null?`${v.withNA} of ${v.openDeals} deals (${v.naRate}%)`:'No open deals',
          'Next action coverage',
          v.noNA>0?`⚠ ${v.noNA} deal${v.noNA>1?'s':''} have no next action set`:'All deals have a next action set',
          v.naRate,90
        )}
        ${Score(
          v.spendPerMove!==null?`${peso(v.spendPerMove)} per stage move`:`${peso(v.travelSpend)} spent · ${v.stageMoves} stage moves`,
          'Travel spend efficiency',
          'Approved travel cost ÷ stage advances this period'
        )}
      `)}

      ${Section('Goals — outcomes','var(--green)',`
        ${Score(`${v.won} deals · ${peso(v.wonVal)}${v.target?` of ${peso(v.target)}`:''}`,'Closed this period',
          v.att!==null?`${v.att}% of quarterly target`:null,v.att||0)}
        ${Score(v.pipeRatio!==null?`${v.pipeRatio}× target (${peso(v.pipeVal)})`:peso(v.pipeVal),
          'Pipeline coverage','Target: 3–4× quarterly goal',
          v.pipeRatio?Math.min(v.pipeRatio/4*100,100):0,75)}
      `)}
    </div>`;
  }).join('')||'<div class="empty">No Sales Agents configured in Team yet.</div>';

  const ssCards=ssAgents.map(u=>{
    const v=ssKpi(u);
    return`<div class="kpiscard">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <div>
          <div style="font-weight:700;font-size:14px">${esc(u.name)}</div>
          <span class="role-lg">Lead Gen</span>
        </div>
      </div>

      ${Section('Behavior KPIs — what the agent controls','var(--amber)',`
        ${Score(v.introduced,'Leads introduced this period','Leads that moved past Untouched')}
        ${Score(v.callsDone,'Calls / touchpoints completed','Call tasks marked done in period')}
        ${Score(v.meetings,'Meetings booked','Deals that reached Meeting Booked or Profile Collected')}
        ${Score(`${v.handoffs} handed off`+(v.assigned?` of ${v.assigned} assigned`:''),'Profiles collected & handed off',
          v.handoffRate!==null?`${v.handoffRate}% handoff rate`:null,
          v.handoffRate||0,60)}
      `)}
    </div>`;
  }).join('')||'<div class="empty">No Lead Gen agents configured in Team yet.</div>';

  return`<div class="row" style="justify-content:space-between;margin-bottom:16px">
    <div class="section-title" style="margin:0">KPIs & Goals — ${label}</div>
    <div class="row">
      <select onchange="KPI_PERIOD=this.value;render()" style="width:auto">
        <option value="quarter" ${KPI_PERIOD==='quarter'?'selected':''}>This quarter</option>
        <option value="month" ${KPI_PERIOD==='month'?'selected':''}>This month</option>
      </select>
      <div style="background:#EDEDE5;border-radius:8px;padding:3px;display:flex;gap:2px">
        <button class="btn sm ${KPI_VIEW==='sa'?'':'sec'}" style="${KPI_VIEW==='sa'?'':'background:transparent;border:none'}" onclick="KPI_VIEW='sa';render()">Sales Agents</button>
        <button class="btn sm ${KPI_VIEW==='ss'?'':'sec'}" style="${KPI_VIEW==='ss'?'':'background:transparent;border:none'}" onclick="KPI_VIEW='ss';render()">Lead Gen</button>
      </div>
    </div>
  </div>
  <div class="notice" style="margin-bottom:16px">
    <b>KPIs = behaviors the agent controls.</b> Goals = outcomes. An agent can miss goal due to market conditions — but missed KPIs are always a coaching conversation.
  </div>
  <div class="kpiscore">${KPI_VIEW==='sa'?saCards:ssCards}</div>`;
}

async function submitQuoteReq(dealId){
  const v=k=>el(k)?.value;

    requested_by:PROFILE.id,
    assigned_to:v('qrf_est')||null,

    special_notes:v('qrf_notes'),

      title:`Prepare quotation — ${deal?.client||''}`,

    });

  render();
}

  ${inprog.length?`<div style="margin-bottom:20px">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--blue);display:inline-block"></span>In progress (${inprog.length})</div>
    ${inprog.map(q=>mkCard(q,isEst)).join('')}
  </div>`:''}

  ${awaiting.length?`<div style="margin-bottom:20px">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);margin-bottom:10px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--amber);display:inline-block"></span>Awaiting suppliers (${awaiting.length})</div>
    ${awaiting.map(q=>mkCard(q,isEst)).join('')}
  </div>`:''}

  ${forReview.length?`<div style="margin-bottom:20px">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7B3FA0;margin-bottom:10px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:#7B3FA0;display:inline-block"></span>For review (${forReview.length})</div>
    ${forReview.map(q=>mkCard(q,isEst)).join('')}
  </div>`:''}

  ${submitted.length?`<div style="margin-bottom:20px">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block"></span>Quotation submitted (${submitted.length})</div>
    ${submitted.map(q=>mkCard(q,false)).join('')}
  </div>`:''}

  ${!QUOTE_REQS.length?`<div class="empty" style="margin-top:40px">No quotation requests yet. Sales Agents submit requests from the Docs tab inside each deal.</div>`:''}`;
}

async function updateQReqStatus(id,status){
  await db.updateQuoteReq(id,{status});
  await loadAll();render();
}

async function handleQReqDrop(event,reqId,dealId){
  event.preventDefault();
  const file=[...event.dataTransfer.files][0];
  if(file)await uploadQReqPDF(file,reqId,dealId);
}
async function handleQReqFile(event,reqId,dealId){
  const file=event.target.files[0];
  if(file)await uploadQReqPDF(file,reqId,dealId);
}
async function uploadQReqPDF(file,reqId,dealId){
  const prog=el('qr-prog-'+reqId);
  if(prog)prog.innerHTML=`<div class="notice" style="margin-top:6px">⬆ Uploading ${esc(file.name)}…</div>`;
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=`${dealId}/quotations/${Date.now()}_${safeName}`;
  const {error}=await sb.storage.from('deal-docs').upload(path,file,{upsert:false});
  if(error){
    if(prog)prog.innerHTML=`<div class="notice" style="background:var(--red-lt);margin-top:6px">Error: ${esc(error.message)}</div>`;
    return;
  }
  // Save to crm_documents
  const {data:doc}=await db.addDoc({deal_id:dealId,type:'Quotation',name:file.name,link:'',filed_by:PROFILE.name,storage_path:path});
  // Mark request as ready and link the doc
  await db.updateQuoteReq(reqId,{status:'quotation_submitted',doc_id:doc?.id||null});
  // Notify SA via activity log
  const deal=DEALS.find(d=>d.id===dealId);
  await db.addActivity({deal_id:dealId,type:'Quotation ready',note:`Quotation "${file.name}" uploaded by ${PROFILE.name} — ready for client.`,by_name:PROFILE.name});
  if(prog)prog.innerHTML='';
  await loadAll();render();
}

// ── AI COACH ──
const COMPANY_RULES=`Prime Agritech Corporation sells poultry farm construction in the Philippines: prefab tunnel-ventilated broiler/breeder houses (e.g. 16x144m, 36,000-40,000 birds), VDL Agrotech equipment.
STANDARD TERMS: 21-day validity (building), 2-month (equipment). Payment: 50% DP + 25% PDC 30d before delivery + 25% PDC 7d before delivery. Equipment: 50/30/20. Lead time 8-10 weeks building. Installation 30-45 days. Cancellation 25%.
EXCLUDED: civil works, electrical, water/plumbing/gas, unloading manpower, double-handling.
PRICING AUTHORITY: 0-3% Sales Head; 3-7% GM; above 7% = GM in writing.
PIPELINE: Lead Gen (Untouched→Profile collected) → handoff → Sales Agent (Evaluation→Closed Sale). KPI clock starts at handoff.
GATES (all 4 before site inspection): Land, Money, Market, Timeline.`;

function playbookCtx(){
  const f=(arr,cat)=>arr.filter(x=>x.category===cat).map(x=>`- ${x.title}: ${x.body}`).join('\n');
  return'PLAYBOOK:\nOBJECTIONS:\n'+f(PLAYBOOK,'objections')+'\nTACTICS:\n'+f(PLAYBOOK,'tactics')+'\nPROOFS:\n'+f(PLAYBOOK,'proofs')+'\nMATERIALS:\n'+f(PLAYBOOK,'materials')+'\nRULEBOOK:\n'+RULEBOOK.map(r=>`[${r.section}] ${r.body}`).join('\n');
}
async function askClaude(system,messages,max=1200){
  if(!API_KEY)throw new Error('Enter your Anthropic API key below.');
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:max,system,messages})});
  if(!res.ok)throw new Error('API error '+res.status);
  const data=await res.json();
  return data.content?.filter(c=>c.type==='text').map(c=>c.text).join('\n')||'';
}

const AI_TOOLS=[
  {k:'coach',t:'Visit Report Coach',d:'Review a report against gates and standards.'},
  {k:'reviewer',t:'Deal Reviewer',d:'Scan stuck deals and draft intervention questions.'},
  {k:'roleplay',t:'Roleplay Trainer',d:'Claude plays a skeptical farm owner. Drill objections.'},
  {k:'precheck',t:'Proposal Pre-Check',d:'Check quotation terms vs pricing authority.'},
];

function buildAI(){
  const objections=PLAYBOOK.filter(p=>p.category==='objections');
  const dealOpts=DEALS.map(d=>`<option value="${d.id}">${esc(d.client)} — ${esc(d.stage)}</option>`).join('');
  const rpScenOpts=objections.map(o=>`<option value="${o.id}" ${RP_SCEN===o.id?'selected':''}>${esc(o.title)}</option>`).join('');
  const menuBtns=AI_TOOLS.map(t=>`<button onclick="AI_TOOL='${t.k}';render()" style="display:block;width:100%;text-align:left;background:${AI_TOOL===t.k?'var(--green-lt)':'#fff'};border:1px solid ${AI_TOOL===t.k?'var(--green)':'var(--line)'};border-radius:8px;padding:12px;margin-bottom:8px;font-size:13px;font-weight:600;cursor:pointer">
    ${t.t}<span style="display:block;font-weight:400;font-size:11px;color:var(--mut);margin-top:3px">${t.d}</span></button>`).join('');

  let panel='';
  if(AI_TOOL==='coach'){panel=`<div class="card"><h3 style="font-size:14px;margin-bottom:10px">Visit Report Coach</h3>
    <div style="margin-bottom:10px"><label>Deal</label><select id="ai_deal" style="width:100%">${dealOpts}</select></div>
    <div style="margin-bottom:10px"><label>Paste visit report</label><textarea id="ai_report" rows="5" placeholder="Who was met, outcome, site findings, next action…"></textarea></div>
    <button class="btn" onclick="runCoach()">✨ Review report</button>
    <div id="ai_out" style="margin-top:12px"></div></div>`;}
  else if(AI_TOOL==='reviewer'){panel=`<div class="card"><h3 style="font-size:14px;margin-bottom:10px">Deal Reviewer</h3>
    <div class="sub" style="margin-bottom:10px">Scans deals with no next action and drafts intervention questions.</div>
    <button class="btn" onclick="runReviewer()">✨ Review stuck deals</button>
    <div id="ai_out" style="margin-top:12px"></div></div>`;}
  else if(AI_TOOL==='roleplay'){panel=`<div class="card"><h3 style="font-size:14px;margin-bottom:10px">Roleplay Trainer</h3>
    <div style="margin-bottom:10px"><label>Objection scenario</label><select id="rp_scen" style="width:100%">${rpScenOpts}</select></div>
    <button class="btn sm" onclick="startRoleplay()" style="margin-bottom:10px">Start roleplay</button>
    ${RP_MSGS.length?`<div style="background:#F4F4EC;border-radius:8px;padding:12px;height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px" id="rp_log">
      ${RP_MSGS.map(m=>`<div style="align-self:${m.role==='user'?'flex-end':'flex-start'};background:${m.role==='user'?'var(--green)':'#fff'};color:${m.role==='user'?'#fff':'var(--ink)'};padding:8px 12px;border-radius:10px;max-width:80%;font-size:13px;white-space:pre-wrap">${esc(m.content)}</div>`).join('')}
    </div>
    <div class="row"><input id="rp_in" placeholder="Your pitch… (type 'feedback' for coaching)" style="flex:1" onkeydown="if(event.key==='Enter')sendRoleplay()"><button class="btn sm" onclick="sendRoleplay()">Send</button></div>`:''}
    </div>`;}
  else{panel=`<div class="card"><h3 style="font-size:14px;margin-bottom:10px">Proposal Pre-Check</h3>
    <div style="margin-bottom:10px"><label>Paste quotation key terms</label><textarea id="ai_precheck" rows="6" placeholder="e.g. Client X, 1x CCS3 16x144. Total ₱18.5M after 5% discount. Payment 40/30/30. Validity 45 days."></textarea></div>
    <button class="btn" onclick="runPrecheck()">✨ Pre-check</button>
    <div id="ai_out" style="margin-top:12px"></div></div>`;}

  return`<div class="section-title">AI Coach</div>
  ${!API_KEY?'<div class="notice" style="margin-bottom:14px">Enter your Anthropic API key below to enable AI tools. Stored in this browser session only.</div>':''}
  <div style="display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start">
    <div>
      ${menuBtns}
      <div style="margin-top:12px"><label>Anthropic API key</label>
        <input type="password" value="${esc(API_KEY)}" onchange="API_KEY=this.value" placeholder="sk-ant-…">
        <div class="sub" style="margin-top:4px">Session only. Sent only to api.anthropic.com.</div>
      </div>
    </div>
    <div>${panel}</div>
  </div>`;
}

async function runCoach(){
  const dealId=el('ai_deal')?.value,report=el('ai_report')?.value;
  const out=el('ai_out');if(!out)return;
  out.innerHTML='<span class="spin dk"></span> Thinking…';
  try{
    const deal=DEALS.find(d=>d.id===dealId);
    const ans=await askClaude(`You are the sales coach for Prime Agritech. Review the visit report against the four gates and inspection standard. Max 200 words. Structure: 1) Good. 2) Missing. 3) Best next step.\n\n${COMPANY_RULES}`,
      [{role:'user',content:`Deal: ${deal?.client}/${deal?.farm}/${deal?.location}. Stage: ${deal?.stage}.\n${report}`}]);
    out.innerHTML=`<div style="background:#F4F4EC;border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13px">${esc(ans)}</div>`;
  }catch(e){out.innerHTML=`<div class="notice">${esc(e.message)}</div>`;}
}
async function runReviewer(){
  const out=el('ai_out');if(!out)return;
  const stuck=DEALS.filter(d=>d.status==='open'&&!d.next_action);
  if(!stuck.length){out.innerHTML='<div class="empty">No stuck deals right now.</div>';return;}
  out.innerHTML='<span class="spin dk"></span> Thinking…';
  try{
    const msg='STUCK DEALS:\n'+stuck.map(d=>`- ${d.client} (${d.farm}) | stage ${d.stage} | value ${peso(d.value)} | next action: NONE`).join('\n');
    const ans=await askClaude(`You are preparing the Sales Head for the weekly pipeline review. For each stuck deal: likely stall cause, 2-3 questions to ask the salesperson, one unsticking move. Brief and practical.\n\n${COMPANY_RULES}\n\n${playbookCtx()}`,
      [{role:'user',content:msg}],1600);
    out.innerHTML=`<div style="background:#F4F4EC;border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13px">${esc(ans)}</div>`;
  }catch(e){out.innerHTML=`<div class="notice">${esc(e.message)}</div>`;}
}
function startRoleplay(){
  RP_SCEN=el('rp_scen')?.value||'';
  RP_MSGS=[{role:'assistant',content:"Magandang umaga. You are from Prime Agritech? I have a few minutes — but I already have a quotation from a local builder and it is much cheaper. Why should I even listen?"}];
  render();
  setTimeout(()=>{const l=el('rp_log');if(l)l.scrollTop=l.scrollHeight;},50);
}
async function sendRoleplay(){
  const inp=el('rp_in');const txt=inp?.value?.trim();if(!txt)return;
  if(inp)inp.value='';
  RP_MSGS=[...RP_MSGS,{role:'user',content:txt}];render();
  setTimeout(()=>{const l=el('rp_log');if(l)l.scrollTop=l.scrollHeight;},50);
  try{
    const scen=PLAYBOOK.find(p=>p.id===RP_SCEN);
    const ans=await askClaude(`You roleplay a skeptical Filipino poultry farm owner. Press objections realistically. Concede only on genuinely good specific arguments. Keep replies 2-4 sentences. If user types "feedback": break character and score 1-10 against the playbook.\n\nScenario: ${scen?.title||'Price objection'}\n\n${COMPANY_RULES}\n\n${playbookCtx()}`,
      RP_MSGS.map(m=>({role:m.role,content:m.content})),600);
    RP_MSGS=[...RP_MSGS,{role:'assistant',content:ans}];render();
    setTimeout(()=>{const l=el('rp_log');if(l)l.scrollTop=l.scrollHeight;},50);
  }catch(e){RP_MSGS=[...RP_MSGS,{role:'assistant',content:'Error: '+e.message}];render();}
}
async function runPrecheck(){
  const txt=el('ai_precheck')?.value;const out=el('ai_out');if(!out)return;
  out.innerHTML='<span class="spin dk"></span> Thinking…';
  try{
    const ans=await askClaude(`You are the quotation pre-send checker for Prime Agritech. Compare the submitted terms against standard terms and pricing authority. Output: 1) PASS or HOLD. 2) Violations with rule broken and who must approve. 3) Missing items. Max 200 words.\n\n${COMPANY_RULES}`,
      [{role:'user',content:txt}]);
    out.innerHTML=`<div style="background:#F4F4EC;border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13px">${esc(ans)}</div>`;
  }catch(e){out.innerHTML=`<div class="notice">${esc(e.message)}</div>`;}
}
